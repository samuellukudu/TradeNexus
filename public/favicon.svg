  <!-- Right anchor -->
  <circle cx="38" cy="26" r="4.5" fill="#60a5fa"/>
  <circle cx="38" cy="26" r="2.2" fill="white"/>
  <!-- Center nexus -->
  <circle cx="26" cy="26" r="6" fill="#3b82f6"/>
